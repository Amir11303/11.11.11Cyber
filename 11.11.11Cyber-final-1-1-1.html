body{overflow:hidden;color:#eee;font-family:Tahoma,Arial,sans-serif}

#login{
 position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
 background:#020303;
}
.login-box{
 width:min(88vw,360px);padding:30px 22px;text-align:center;
 border:1px solid #24ff55;background:#030703;
 box-shadow:0 0 28px #00ff4428,inset 0 0 18px #00ff4410;
}
input{
 width:100%;padding:14px;background:#000;color:#fff;border:1px solid #1fb947;
 outline:none;text-align:center;font-size:16px
}
button{
 margin-top:12px;padding:12px 32px;background:#001b08;color:#3cff68;
 border:1px solid #31ff61;font-weight:bold
}
#error{height:22px;margin-top:8px;color:#35ff62}

#game{
 display:none;position:fixed;inset:0;background:#000;overflow:hidden;
}
.frame{position:absolute;inset:0;pointer-events:none}
.frame:before,.frame:after{
 content:"";position:absolute;inset:14px;
 border:2px solid #1cff4f;
 clip-path:polygon(0 0,4% 0,4% 2%,18% 2%,21% 0,39% 0,42% 4%,58% 4%,61% 0,82% 0,84% 2%,96% 2%,96% 0,100% 0,100% 100%,96% 100%,96% 98%,82% 98%,79% 100%,61% 100%,58% 96%,42% 96%,39% 100%,18% 100%,16% 98%,4% 98%,4% 100%,0 100%);
 box-shadow:0 0 9px #00ff4433;
}
.frame:after{
 inset:28px;border-width:1px;opacity:.55;
 clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
}
.corner{
 position:absolute;width:44px;height:44px;border-color:#27ff58;border-style:solid;
 filter:drop-shadow(0 0 4px #00ff55)
}
.c1{top:20px;left:18px;border-width:3px 0 0 3px}
.c2{top:20px;right:18px;border-width:3px 3px 0 0}
.c3{bottom:20px;left:18px;border-width:0 0 3px 3px}
.c4{bottom:20px;right:18px;border-width:0 3px 3px 0}

.scan{
 position:absolute;inset:-35%;pointer-events:none;
 background:linear-gradient(115deg,transparent 43%,rgba(20,255,75,.025) 46%,
 rgba(38,255,83,.18) 49%,rgba(150,255,170,.06) 50%,transparent 54%);
 filter:blur(8px);animation:diagonalScan 6.5s ease-in-out infinite;
}
.scanline{
 position:absolute;width:150%;height:2px;left:-25%;top:-15%;
 background:linear-gradient(90deg,transparent,#34ff62,transparent);
 box-shadow:0 0 12px #00ff55,0 0 35px #00ff55;
 transform:rotate(-12deg);opacity:.6;
 animation:lineScan 6.5s ease-in-out infinite;
}
.noise{
 position:absolute;inset:0;opacity:.08;pointer-events:none;
 background-image:linear-gradient(rgba(30,255,75,.15) 1px,transparent 1px),
 linear-gradient(90deg,rgba(30,255,75,.12) 1px,transparent 1px);
 background-size:46px 46px;animation:noise 12s linear infinite;
}
.vignette{position:absolute;inset:0;background:radial-gradient(circle,transparent 42%,#000 100%);pointer-events:none}

.content{
 position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 padding:19vh 7vw 10vh;z-index:2;
}
.topText{
 max-width:900px;text-align:center;font-size:clamp(18px,4vw,31px);line-height:1.9;
 text-shadow:0 0 7px #fff;
 animation:floatText 3.8s ease-in-out infinite;
}
.divider{
 width:min(58vw,600px);height:2px;margin:28px 0 82px;
 background:linear-gradient(90deg,transparent,#d8ffe0,transparent);
 box-shadow:0 0 8px #36ff65;
}
.terminal{
 direction:ltr;align-self:center;width:min(72vw,700px);font-family:monospace;
 font-size:clamp(18px,3.8vw,31px);line-height:1.45;color:#21ff4f;
 text-align:left;text-shadow:0 0 8px #00ff44;
}
.termLine{white-space:nowrap}
.progress{
 direction:ltr;display:flex;align-items:center;gap:18px;margin-top:14px;
}
.bar{
 width:min(34vw,330px);height:22px;border:2px solid #21ff4f;padding:3px;
}
.fill{height:100%;width:47%;background:#21ff4f;box-shadow:0 0 8px #00ff44}
.percent{font-size:clamp(18px,3.8vw,30px)}
.info{
 margin-top:82px;text-align:center;font-size:clamp(19px,4vw,31px);
 line-height:2.05;
}
.telegram{
 direction:ltr;display:inline-block;margin-top:6px;color:#1495ff;
 font-size:clamp(27px,5vw,42px);text-shadow:0 0 8px #008cff,0 0 20px #006cff;
}
.bottom{
 position:absolute;z-index:3;bottom:16vh;width:100%;text-align:center;
 font-family:Arial,sans-serif;letter-spacing:4px;font-size:clamp(15px,3vw,23px);
 direction:ltr;color:#eee;text-shadow:0 0 7px #fff;

}
.bottomLine{
 width:min(55vw,560px);height:2px;margin:22px auto 0;
 background:linear-gradient(90deg,transparent,#d9ffe0,transparent);
 box-shadow:0 0 7px #31ff60
}

@keyframes diagonalScan{
 0%{transform:translate(-35%,-35%) rotate(-4deg)}
 50%{transform:translate(25%,25%) rotate(-4deg)}
 100%{transform:translate(75%,75%) rotate(-4deg)}
}
@keyframes lineScan{
 0%{top:-18%;opacity:0}
 12%{opacity:.65}
 50%{top:105%;opacity:.7}
 100%{top:125%;opacity:0}
}
@keyframes noise{to{background-position:46px 46px}}
@keyframes floatText{
 0%,100%{transform:translateY(0);opacity:.86}
 50%{transform:translateY(-6px);opacity:1}
}
@keyframes bottomFloat{
 0%,100%{transform:translateY(0);opacity:.72}
 50%{transform:translateY(-5px);opacity:1;text-shadow:0 0 12px #fff}
}

@media(max-width:600px){
 .content{padding:11vh 6vw 7vh}
 .topText{line-height:1.8}
 .divider{margin:18px 0 48px}
 .terminal{width:92vw;font-size:clamp(15px,4.3vw,24px)}
 .termLine{white-space:normal;text-align:center}
 .progress{justify-content:center;gap:10px}
 .bar{width:min(55vw,300px);height:18px}
 .info{margin-top:42px;font-size:clamp(17px,4.5vw,27px);line-height:1.65}
 .telegram{font-size:clamp(24px,6vw,38px);margin-top:8px}
 .bottom{margin-top:44px;letter-spacing:2px;font-size:clamp(11px,3.1vw,19px)}
 .bottomLine{margin-top:16px;width:min(75vw,500px)}
}

#boot{display:none;position:fixed;inset:0;z-index:20;background:#020303;color:#35ff62;padding:24px;font-family:monospace;overflow:hidden;direction:ltr}
#boot:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,255,80,.035) 4px);pointer-events:none}
.boot-head{position:relative;z-index:1;margin-bottom:14px;color:#7dff9a;font-size:14px;letter-spacing:1px}.boot-lines{position:relative;z-index:1;font-size:13px;line-height:1.55;text-shadow:0 0 7px rgba(0,255,80,.35);height:calc(100vh - 90px);overflow:auto}.boot-line{white-space:pre-wrap;cursor:pointer;padding:2px 4px;border-radius:3px}.boot-line:active,.boot-line.active{background:rgba(53,255,98,.16);text-shadow:0 0 12px rgba(53,255,98,.85)}.boot-response{margin:0 0 3px 16px;color:#9dffb1;font-size:12px;opacity:.95}.boot-cursor{display:inline-block;width:8px;height:14px;background:#35ff62;animation:blink .7s infinite;vertical-align:-2px}@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <input id="password" type="password" placeholder="گذرواژه را وارد کنید" autocomplete="off">
    <button id="enter" type="button">ورود</button>
    <div id="error"></div>
  </div>
</div>


<div id="boot"><div class="boot-head">TERMUX SESSION // INITIALIZING</div><div id="bootLines" class="boot-lines"></div><span class="boot-cursor"></span></div>

<div id="game">
  <div class="noise"></div>
  <div class="scan"></div>
  <div class="scanline"></div>
  <div class="vignette"></div>

  <main class="content">
    <div class="topText">
      علامت سوال هرچقدر هم نامعلوم باشد پنهان نیست چون !<br>
      مشخصه که یک علامت هست.
    </div>

    <div class="divider"></div>

    <section class="terminal">
      <div class="termLine">root@null:~# ./0x11 --scan</div>
      <div class="progress">
        <div class="bar"><div class="fill"></div></div>
        <span class="percent">41%</span>
      </div>
    </section>

    <div class="info">
      درصورت ورود به سایت اصلی A11<br>
      به آیدی تلگرام پیام دهید<br>
      <a class="telegram" href="https://t.me/Makarov_A11" target="_blank" rel="noopener noreferrer">@Makarov_A11</a>
    </div>

    <div class="bottom">
      SEARCHING FOR A SPECIFIC PERSON'S IP
      <div class="bottomLine"></div>
    </div>
  </main>
</div>

<script>
const password=document.getElementById("password");
const enter=document.getElementById("enter");
const login=document.getElementById("login");
const game=document.getElementById("game");
const error=document.getElementById("error");
const boot=document.getElementById("boot");
const bootLines=document.getElementById("bootLines");
const fakeResponses=["[OK] MODULE VERIFIED","[OK] RESPONSE: STABLE","[OK] SESSION CHECKED","[OK] STATUS: ACTIVE","[OK] BUFFER SYNCHRONIZED","[OK] ROUTE CONFIRMED","[OK] PROCESS COMPLETE"];
let responseIndex=0;

const bootCommands=[
"$ pkg update -y", "$ termux-info", "$ mkdir -p /data/local/session", "$ echo '[OK] loading modules'", "$ uname -a", "$ ls -la /data/data", "$ ping -c 1 node.local", "$ ip route show", "$ ps -A | head", "$ df -h", "$ id", "$ date -u", "$ printf 'SYNC COMPLETE\n'", "$ find /tmp -maxdepth 1 -type f", "$ echo 'checking encrypted channels...'", "$ getprop ro.product.model", "$ logcat -d -t 2", "$ echo 'verifying session token...'", "$ whoami", "$ echo 'connection stable'", "$ printf '[##########] 100%%\n'", "$ clear-cache --session", "$ echo 'ACCESS LAYER READY'", "$ echo 'routing interface...'", "$ echo 'finalizing boot sequence...'"
];
function startBoot(){
  bootLines.innerHTML='';
  let i=0;
  const started=Date.now();
  const timer=setInterval(()=>{
    const elapsed=Date.now()-started;
    if(elapsed>=10000){
      clearInterval(timer);
      const done=document.createElement('div');
      done.className='boot-response';
      done.textContent='[OK] ACCESS GRANTED';
      bootLines.appendChild(done);
      setTimeout(()=>{boot.style.display='none';game.style.display='block';},450);
      return;
    }
    const cmd=bootCommands[i % bootCommands.length];
    const n=Math.floor(i/bootCommands.length)+1;
    const line=document.createElement('div');
    line.className='boot-line';
    line.textContent=cmd+(i>=bootCommands.length?'  // '+n:'');
    line.addEventListener('click',()=>{
      line.classList.add('active');
      const old=line.nextElementSibling;
      if(!old || !old.classList.contains('boot-response')){
        const out=document.createElement('div');
        out.className='boot-response';
        out.textContent='> '+fakeResponses[responseIndex++ % fakeResponses.length];
        line.insertAdjacentElement('afterend',out);
      }
      setTimeout(()=>line.classList.remove('active'),350);
    });
    bootLines.appendChild(line);
    bootLines.scrollTop=bootLines.scrollHeight;
    i++;
  },170);
}

function unlock(){
  if(password.value==="ir11Alcatraz11"){
    login.style.display="none";
    boot.style.display="block";
    startBoot();
  }else{
    error.textContent="رمز اشتباه است!";
    password.value="";
    password.focus();
  }
}
enter.addEventListener("click",unlock);
password.addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
</script>
